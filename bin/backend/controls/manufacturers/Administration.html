<form class="quiqqer-erp-manufacturers-administration-search"
      name="customer-search"
      data-name="search-form"
      role="search"
      aria-label="{{searchPlaceholder}}">
    <input type="search"
           name="search"
           data-name="search-input"
           placeholder="{{searchPlaceholder}}"
           aria-label="{{searchPlaceholder}}"/>
    <button type="submit" name="submit" data-name="search-submit" class="qui-button" aria-label="{{searchPlaceholder}}">
        <span class="fa fa-search" aria-hidden="true"></span>
    </button>
</form>
<div class="quiqqer-erp-manufacturers-administration-search-filter"
     data-name="filters"
     role="dialog"
     aria-label="{{filterLabel}}"
     hidden>
    <fieldset>
        <legend>{{filterTitle}}</legend>
        <div class="quiqqer-erp-manufacturers-administration-search-filter-checks">
            <label><input type="checkbox" data-name="filter-field" name="userId" checked/><span>{{filterUserId}}</span></label>
            <label><input type="checkbox" data-name="filter-field" name="username" checked/><span>{{filterUsername}}</span></label>
            <label><input type="checkbox" data-name="filter-field" name="firstname" checked/><span>{{filterFirstname}}</span></label>
            <label><input type="checkbox" data-name="filter-field" name="lastname" checked/><span>{{filterLastname}}</span></label>
            <label><input type="checkbox" data-name="filter-field" name="email" checked/><span>{{filterEmail}}</span></label>
            <label><input type="checkbox" data-name="filter-field" name="company" checked/><span>{{filterCompany}}</span></label>
        </div>
    </fieldset>
</div>
<div class="quiqqer-erp-manufacturers-administration-grid" data-name="grid"></div>
