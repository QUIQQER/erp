{{#showPosSummary}}
<div class="quiqqer-erp-backend-temporaryErp-summary-pos">
    <div class="quiqqer-erp-backend-temporaryErp-summary-pos-title">{{labelPosInfo}}:</div>

    <div class="quiqqer-erp-backend-temporaryErp-summary-pos-netto">
        <span class="netto-title">{{labelNet}}:</span>
        <span class="netto-value"></span>
    </div>
    <div class="quiqqer-erp-backend-temporaryErp-summary-pos-brutto">
        <span class="brutto-title">{{labelGross}}:</span>
        <span class="brutto-value"></span>
    </div>
</div>
{{/showPosSummary}}
<div class="quiqqer-erp-backend-temporaryErp-summary-total">
    <div class="quiqqer-erp-backend-temporaryErp-summary-total-title">{{labelSums}}:</div>

    <div class="quiqqer-erp-backend-temporaryErp-summary-total-vat">
        <span class="vat-title">{{labelVat}}:</span>
        <div class="quiqqer-erp-summary-tax-editor">
            <div class="vat-value" data-name="tax-totals"></div>
            <button type="button" class="qui-button quiqqer-erp-summary-add-tax" data-name="add-manual-tax" title="{{labelAddTax}}" aria-label="{{labelAddTax}}" hidden>
                <span aria-hidden="true">%<sup>+</sup></span>
            </button>
        </div>
    </div>
    <div class="quiqqer-erp-backend-temporaryErp-summary-total-netto">
        <span class="netto-title">{{labelNet}}:</span>
        <span class="netto-value" data-name="net-total"></span>
    </div>
    <div class="quiqqer-erp-backend-temporaryErp-summary-total-brutto">
        <span class="brutto-title">{{labelGross}}:</span>
        <span class="brutto-value" data-name="gross-total"></span>
    </div>
</div>
<div class="quiqqer-erp-summary-manual-extra" data-name="manual-extra" hidden>
    <details>
        <summary>{{labelOtherTotals}}</summary>
        <div class="quiqqer-erp-summary-manual-subtotals">
            <label><span>{{labelNetBefore}}:</span><input type="number" step="any" required data-name="manual-total" data-field="nettoSubSum"></label>
            <label><span>{{labelSubtotal}}</span><input type="number" step="any" required data-name="manual-total" data-field="subSum"></label>
            <label><span>{{labelGrossBefore}}:</span><input type="number" step="any" required data-name="manual-total" data-field="grandSubSum"></label>
        </div>
    </details>
</div>
