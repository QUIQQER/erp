<header class="quiqqer-erp-totals-window-header">
    <span class="quiqqer-erp-totals-window-icon fa fa-calculator" aria-hidden="true"></span>
    <div>
        <h2>{{title}}</h2>
        <p data-name="description"></p>
    </div>
    <span class="quiqqer-erp-totals-window-mode" data-name="mode"></span>
</header>
<div class="quiqqer-erp-totals-window-body">
    <div data-name="totals"></div>
    <section class="quiqqer-erp-totals-window-factors">
        <h3>{{labelFactors}}</h3>
        <div class="quiqqer-erp-totals-window-factors-content" data-name="price-factors"></div>
    </section>
</div>
<footer class="quiqqer-erp-totals-window-footer">
    <button type="button" class="btn btn-primary" data-name="close-totals">{{labelClose}}</button>
</footer>
