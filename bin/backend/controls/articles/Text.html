<div class="quiqqer-erp-backend-erpArticleText-pos cell" data-label="#"></div>
<div class="quiqqer-erp-backend-erpArticleText-text cell" data-label="{{labelDescription}}"></div>

<div class="quiqqer-erp-backend-erpArticleText-buttons quiqqer-erp-backend-erpArticle-articleEdit">
    <button type="button" name="replace" class="btn btn-link-body">
        <span class="fa fa-retweet" aria-hidden="true"></span>
        <span>{{buttonReplace}}</span>
    </button>
    <button type="button" name="delete" class="btn btn-link-body">
        <span class="fa fa-trash" aria-hidden="true"></span>
        <span>{{buttonDelete}}</span>
    </button>
</div>
